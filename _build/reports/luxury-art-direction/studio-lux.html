<script type="module">
/* PHASE 2 · §49 — THE ALTIMETER PRESENTATION STUDY.
 *
 * The SAME asset the homepage loads. Nothing about the GLB, its materials or
 * the production MeridianLights component is modified by this file — it is a
 * photographic studio, and the only things it varies are the ones a
 * photographer varies: lamp intensity, lamp colour, lens length, exposure.
 *
 * The default values below are MeridianLights.tsx's, verbatim, so that
 * "current presentation" in the comparison is the real current presentation
 * rather than a reconstruction of it.
 */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const SIZE = 1200;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.setClearAlpha(0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);

const amb  = new THREE.AmbientLight(0x8ea3bd, 0.62); scene.add(amb);
const key  = new THREE.DirectionalLight(0xeef4ff, 4.6); key.position.set(-2.4, 3.2, 2.6); scene.add(key);
const fill = new THREE.DirectionalLight(0x5b7ba8, 1.7); fill.position.set(3.0, -1.4, -1.8); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xc3d6ef, 2.2); rim.position.set(1.6, 2.2, -3.0); scene.add(rim);

const root = new THREE.Group(); scene.add(root);
window.__ready = false;

new GLTFLoader().load('/models/stratos-altimeter.glb', (g) => {
  root.add(g.scene);
  const box = new THREE.Box3().setFromObject(g.scene);
  g.scene.position.sub(box.getCenter(new THREE.Vector3()));
  window.__ready = true;
});

window.__render = (opts) => {
  const o = Object.assign({
    rx: 0, ry: 0, rz: 0, dist: 4.2, fov: 28, exposure: 1.0,
    keyI: 4.6, keyC: 0xeef4ff, keyPos: [-2.4, 3.2, 2.6],
    fillI: 1.7, fillC: 0x5b7ba8, fillPos: [3.0, -1.4, -1.8],
    rimI: 2.2, rimC: 0xc3d6ef, rimPos: [1.6, 2.2, -3.0],
    ambI: 0.62, ambC: 0x8ea3bd,
  }, opts || {});
  root.rotation.set(o.rx, o.ry, o.rz);
  camera.fov = o.fov; camera.updateProjectionMatrix();
  camera.position.set(0, 0, o.dist); camera.lookAt(0, 0, 0);
  renderer.toneMappingExposure = o.exposure;
  key.intensity = o.keyI;  key.color.setHex(o.keyC);  key.position.set(...o.keyPos);
  fill.intensity = o.fillI; fill.color.setHex(o.fillC); fill.position.set(...o.fillPos);
  rim.intensity = o.rimI;  rim.color.setHex(o.rimC);  rim.position.set(...o.rimPos);
  amb.intensity = o.ambI;  amb.color.setHex(o.ambC);
  renderer.render(scene, camera);
  return true;
};
</script>
</body></html>
