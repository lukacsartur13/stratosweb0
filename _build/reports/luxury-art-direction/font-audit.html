<!doctype html><html lang="hu"><head><meta charset="utf-8">
<title>Stratos — provisioned font audit</title>
<link rel="stylesheet" href="fonts.css">
<style>body{font-family:'Archivo';}
 .probe{font-family:'Archivo';}
 .probe-ab{font-family:'Aboreto';}
 .probe-jb{font-family:'JetBrains Mono';}
 /* every glyph the audit measures has to be on the page, or the subset that
    contains it is never fetched and every measurement reads as a fallback. */
 .warm{position:absolute;left:-9999px;font-size:20px;}
</style></head><body>

<div class="warm probe-ab">ÁÉÍÓÖŐÚÜŰáéíóöőúüűßäÄMagasságot STRATOS</div>
<div class="warm probe-jb">ÁÉÍÓÖŐÚÜŰáéíóöőúüűßäÄ0123456789 M</div>
<span id="p" style="position:absolute;white-space:pre;font-size:100px;"></span>
