<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- A development-only production *candidate*. It is never linked from the
         live site and never built by the root `npm run build`, but the tag costs
         nothing and removes any doubt if a copy is ever served somewhere. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <title>Stratos — Út a sztratoszférába (0–30 000 m)</title>
    <meta
      name="description"
      content="Produkciós jelölt: a teljes Stratos emelkedési narratíva a földi kalibrációtól 30 000 méterig, valódi 3D-ben, teljes értékű HTML tartalommal."
    />
    <link rel="icon" href="/assets/img/favicon.png" />

    <!-- The typography, on the same terms as the three locale shells in `home/`.
         Without this the route has no `--font-display` at all and every heading
         falls back to the browser's default serif — which is what it did, while
         production rendered Archivo.

         That mattered more here than on any other page, because this file is
         the route the full-ascent suite and the evaluation stills are built
         from. Layout collision, viewport overflow and every accepted still were
         being measured against Times metrics that the live site never uses, and
         the kinetic typography could not work at all: it drives `wght` and
         `wdth`, and Times has no variation axes to drive.

         Root-relative on purpose. It is correct in the built output, where this
         route and `dist/assets/` are served by one static server, and the dev
         server's base-prefixed rewrite of it is handled by `siteAssets`. -->
    <link
      rel="preload"
      href="/assets/fonts/archivo/archivo-normal-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/archivo/archivo-normal-latin-ext.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/css/type.css" />
  </head>
  <body>
    <!-- The React mount host *is* the main landmark, and it has to be, because
         both entries mount onto `#main`. This prototype shares the journey with
         the three production locale shells — one application, four documents —
         so it carries the same host. See experiments/home/hu.html for the
         reasoning behind the arrangement.

         The ENTRY is its own, and only since the homepage stopped mounting on
         load: `src/full/main.tsx` waits for the visitor's first move and has a
         static opening frame to show while it waits, and this document has
         neither. `src/full/prototype.tsx` is four lines that import the same
         journey and mount it straight away, which is what keeps this route the
         fixed baseline the benchmarks are written against. -->
    <main class="journey" id="main" tabindex="-1"></main>
    <script type="module" src="/src/full/prototype.tsx"></script>
  </body>
</html>
