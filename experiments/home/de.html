<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />

    <title>Stratos — Digitale Systeme, die Wachstum bringen | Győr &amp; Budapest</title>
    <meta name="description" content="Website, Branding und Werbebetreuung aus einer Hand, im Monatsmodell. Vom KMU bis zum Großunternehmen — Győr und Budapest." />

    <!-- Canonical and Open Graph are NEW, not migrated: the previous homepage
         carried neither, on any of the three languages. The alternates below
         are migrated verbatim from it, including the absolute paths and the
         x-default pointing at Hungarian. -->
    <link rel="canonical" href="https://media-stratos.com/de/" />
    <link rel="alternate" hreflang="hu" href="https://media-stratos.com/" />
    <link rel="alternate" hreflang="en" href="https://media-stratos.com/en/" />
    <link rel="alternate" hreflang="de" href="https://media-stratos.com/de/" />
    <link rel="alternate" hreflang="x-default" href="https://media-stratos.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stratos" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:locale:alternate" content="hu_HU" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:url" content="https://media-stratos.com/de/" />
    <meta property="og:title" content="Stratos — Digitale Systeme, die Wachstum bringen | Győr &amp; Budapest" />
    <meta property="og:description" content="Website, Branding und Werbebetreuung aus einer Hand, im Monatsmodell. Vom KMU bis zum Großunternehmen — Győr und Budapest." />
    <meta property="og:image" content="https://media-stratos.com/assets/img/hero.jpg" />
    <meta property="og:image:width" content="1800" />
    <meta property="og:image:height" content="1012" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stratos — Digitale Systeme, die Wachstum bringen | Győr &amp; Budapest" />
    <meta name="twitter:description" content="Website, Branding und Werbebetreuung aus einer Hand, im Monatsmodell. Vom KMU bis zum Großunternehmen — Győr und Budapest." />
    <meta name="twitter:image" content="https://media-stratos.com/assets/img/hero.jpg" />

    <link rel="icon" href="/assets/img/favicon.png" />
    <!-- Typography is self-hosted and shared with the eleven static pages: one
         file, one cache entry, no third-party origin in the critical path. The
         preconnects that used to sit here pointed at a Google Fonts stylesheet
         this route never actually requested. See assets/css/type.css. -->
    <link rel="preload" href="/assets/fonts/archivo/archivo-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/type.css" />
    <!-- Phase 7 page transitions. The homepage opts in from CSS like every
         other document; the script only assigns the transition category and
         is never required for a link to work. See assets/css/transitions.css. -->
    <link rel="stylesheet" href="/assets/css/transitions.css" />
    <script src="/assets/js/transitions.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Zum Inhalt springen</a>
    <!-- The React mount host *is* the main landmark — see home/hu.html for why.
         In short: React renders into a container and never replaces it, so a
         landmark that is the container exists in the parsed shell before any
         module is fetched and survives every mount underneath it. -->
    <main class="journey" id="main" tabindex="-1"></main>
    <script type="module" src="/src/full/main.tsx"></script>
  </body>
</html>
