    <meta charset="utf-8" />

    <title>Stratos — Digitális rendszerek, amik növekedést hoznak | Győr &amp; Budapest</title>

    <!-- Canonical and Open Graph are NEW, not migrated: the previous homepage
         carried neither, on any of the three languages. The alternates below
         are migrated verbatim from it, including the absolute paths and the
         x-default pointing at Hungarian. -->
    <link rel="canonical" href="%SITE_ORIGIN%/" />
    <link rel="alternate" hreflang="hu" href="%SITE_ORIGIN%/" />
    <link rel="alternate" hreflang="en" href="%SITE_ORIGIN%/en/" />
    <link rel="alternate" hreflang="de" href="%SITE_ORIGIN%/de/" />
    <link rel="alternate" hreflang="x-default" href="%SITE_ORIGIN%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stratos" />
    <meta property="og:locale" content="hu_HU" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:title" content="Stratos — Digitális rendszerek, amik növekedést hoznak | Győr &amp; Budapest" />
    <meta property="og:description" content="Weboldal, branding és hirdetéskezelés egy kézben, havidíjas konstrukcióban. KKV-tól nagyvállalatig — Győr és Budapest." />
    <meta property="og:image" content="%SITE_ORIGIN%/assets/img/hero.jpg" />
    <meta property="og:image:width" content="1800" />
    <meta property="og:image:height" content="1012" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stratos — Digitális rendszerek, amik növekedést hoznak | Győr &amp; Budapest" />
    <meta name="twitter:description" content="Weboldal, branding és hirdetéskezelés egy kézben, havidíjas konstrukcióban. KKV-tól nagyvállalatig — Győr és Budapest." />
    <meta name="twitter:image" content="%SITE_ORIGIN%/assets/img/hero.jpg" />

    <link rel="icon" href="/assets/img/favicon.png" />
    <!-- Typography is self-hosted and shared with the eleven static pages: one
         file, one cache entry, no third-party origin in the critical path. The
         preconnects that used to sit here pointed at a Google Fonts stylesheet
         this route never actually requested. See assets/css/type.css. -->
    <link rel="preload" href="/assets/fonts/archivo/archivo-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/archivo/archivo-normal-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/aboreto/aboreto-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/type.css" />
    <!-- The site chrome's stylesheet, i18n block and lead controller, generated
         by _build/build.py into _build/home-chrome.json and substituted here by
         experiments/vite.home.config.ts. The homepage renders byte-identical
         header, menu, Arrival and footer markup to the other 66 routes; there
         is no second navigation system for this one page. A shell that loses a
         slot is a build error, not a page that quietly ships without a footer. -->
    <!--stratos:head-->
    <!-- Keeping the visitor's place across a history navigation. Synchronous
         and in <head> on purpose: the browser applies its scroll restoration at
         first layout, so the height this reserves has to be in the cascade
         before the body is parsed. It is the only script on the site that is
         neither `defer` nor at the end of <body>, and the reason is that a
         deferred copy would run after the moment it exists to survive.
         See assets/js/home-history.js. -->
    <script src="/assets/js/home-history.js"></script>
    <!-- Phase 7 page transitions. The homepage opts in from CSS like every
         other document; the script only assigns the transition category and
         is never required for a link to work. See assets/css/transitions.css. -->
    <link rel="stylesheet" href="/assets/css/transitions.css" />
    <script src="/assets/js/transitions.js" defer></script>
  </head>
  <body class="journey-home" data-ceiling="30000" data-page-key="index">
    <a class="skip" href="#main">Ugrás a tartalomra</a>
    <!--stratos:deck-->

    <!-- The React mount host *is* the main landmark, and that is the point.

         React renders into a container; it never replaces it. So a landmark
         that is the container exists in the parsed HTML shell, before the
         first module is fetched, and survives every mount, unmount and error
         boundary underneath it. The alternative — React rendering its own
         <main id="main"> inside a <div id="root"> — makes the landmark appear
         one 1 MB chunk after the document is ready, which means the skip link
         above points at nothing on arrival and the transition controller has
         no destination to hand focus to. See assets/js/transitions.js §25.

         `tabindex="-1"` is in the markup rather than added by script for the
         same reason: it has to be true at the moment the document is revealed.
         It makes the element a programmatic focus target and a working skip
         destination without adding a tab stop. -->
    <!-- `data-motion-external`: everything inside this element belongs to the
         journey's own clock. assets/js/motion.js registers no primitive in
         here, which matters because the eleven panels carry `data-stage` and
         `data-kinetic` — two of that file's own primitive hooks. -->
    <main class="journey" id="main" tabindex="-1" data-motion-external></main>

    <!-- Arrival, then the shared ground-control footer. Outside <main>, after
         it, so the landmark React owns stays exactly one element. -->
    <!--stratos:footer-->
    <script type="module" src="/src/full/main.tsx"></script>
    <!--stratos:scripts-->
  </body>
</html>
