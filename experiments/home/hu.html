<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />

    <title>Weboldal készítés és fejlesztés | Stratos</title>
    <meta name="description" content="Weboldal készítés, branding és hirdetéskezelés egy kézben, egyedi ajánlattal. Győrből, KKV-tól nagyvállalatig, magyarul, angolul és németül." />

    <!-- Canonical and Open Graph are NEW, not migrated: the previous homepage
         carried neither, on any of the three languages. The alternates below
         are migrated verbatim from it, including the absolute paths and the
         x-default pointing at Hungarian. -->
    <link rel="canonical" href="%SITE_ORIGIN%/" />
    <link rel="alternate" hreflang="hu" href="%SITE_ORIGIN%/" />
    <link rel="alternate" hreflang="en" href="%SITE_ORIGIN%/en/" />
    <link rel="alternate" hreflang="de" href="%SITE_ORIGIN%/de/" />
    <link rel="alternate" hreflang="x-default" href="%SITE_ORIGIN%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stratos Webdesign" />
    <meta property="og:locale" content="hu_HU" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:title" content="Weboldal készítés és fejlesztés | Stratos" />
    <meta property="og:description" content="Weboldal készítés, branding és hirdetéskezelés egy kézben, egyedi ajánlattal. Győrből, KKV-tól nagyvállalatig, magyarul, angolul és németül." />
    <meta property="og:image" content="%SITE_ORIGIN%/assets/img/og-stratos.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Csapat laptopokon dolgozik egy ovális asztal körül, felülnézetből." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Weboldal készítés és fejlesztés | Stratos" />
    <meta name="twitter:description" content="Weboldal készítés, branding és hirdetéskezelés egy kézben, egyedi ajánlattal. Győrből, KKV-tól nagyvállalatig, magyarul, angolul és németül." />
    <meta name="twitter:image" content="%SITE_ORIGIN%/assets/img/og-stratos.jpg" />
    <meta name="twitter:image:alt" content="Csapat laptopokon dolgozik egy ovális asztal körül, felülnézetből." />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/assets/img/favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
    <!-- Typography is self-hosted and shared with the eleven static pages: one
         file, one cache entry, no third-party origin in the critical path. The
         preconnects that used to sit here pointed at a Google Fonts stylesheet
         this route never actually requested. See assets/css/type.css. -->
    <link rel="preload" href="/assets/fonts/archivo/archivo-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/archivo/archivo-normal-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/aboreto/aboreto-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/type.css" />
    <!-- The site chrome's stylesheet, i18n block and lead controller, generated
         by _build/build.py into _build/home-chrome.json and substituted here by
         experiments/vite.home.config.ts. The homepage renders byte-identical
         header, menu, Arrival and footer markup to the other 66 routes; there
         is no second navigation system for this one page. A shell that loses a
         slot is a build error, not a page that quietly ships without a footer. -->
    <!--stratos:head-->
    <!-- Keeping the visitor's place across a history navigation. Synchronous
         and in <head> on purpose: the browser applies its scroll restoration at
         first layout, so the height this reserves has to be in the cascade
         before the body is parsed. It is the only script on the site that is
         neither `defer` nor at the end of <body>, and the reason is that a
         deferred copy would run after the moment it exists to survive.
         See assets/js/home-history.js. -->
    <script src="/assets/js/home-history.js"></script>
    <!-- Phase 7 page transitions. The homepage opts in from CSS like every
         other document; the script only assigns the transition category and
         is never required for a link to work. See assets/css/transitions.css. -->
    <link rel="stylesheet" href="/assets/css/transitions.css" />
    <script src="/assets/js/transitions.js" defer></script>
  </head>
  <body class="journey-home" data-ceiling="30000" data-page-key="index">
    <a class="skip" href="#main">Ugrás a tartalomra</a>
    <!--stratos:deck-->

    <!-- The main landmark is in the parsed shell, and it holds everything the
         page itself says: the journey and the written statement under it.

         It exists before the first module is fetched and is never touched by
         React, so the skip link above points at something on arrival and the
         transition controller has a destination to hand focus to the moment
         the document is revealed. See assets/js/transitions.js §25.

         `tabindex="-1"` is in the markup rather than added by script for the
         same reason: it has to be true at the moment the document is revealed.
         It makes the element a programmatic focus target and a working skip
         destination without adding a tab stop.

         It used to BE the React container, which is why the written statement
         sat outside it: a container's first commit empties it. The container
         is now the <div> inside, so <main> can wrap the whole of the content
         and the landmark says what it should. -->
    <main id="main" tabindex="-1">
      <!-- The React mount host. It ships with the journey's words already in
           it — the opening frame, then the other ten stages set plainly, both
           generated at build time from the tables the compositions read (see
           experiments/vite.home.config.ts) — and `createRoot`'s first commit
           replaces them with the composition this device gets.

           `data-motion-external`: everything inside this element belongs to
           the journey's own clock. assets/js/motion.js registers no primitive
           in here, which matters because the eleven panels carry `data-stage`
           and `data-kinetic` — two of that file's own primitive hooks. -->
      <div class="journey" id="journey" data-motion-external>
        <!--stratos:opening-->
        <!--stratos:narrative-->
      </div>

      <!-- The homepage's written statement; see `GROUND` in _build/build.py. -->
      <!--stratos:ground-->
    </main>

    <!-- Arrival, then the shared ground-control footer, after the landmark. -->
    <!--stratos:footer-->
    <script type="module" src="/src/full/main.tsx"></script>
    <!--stratos:scripts-->
  </body>
</html>
