<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Claude Design">
  <!--
    App icon / maskable icon. 512×512 with the mark at 62% of the canvas, so
    it survives the 40% safe-zone crop Android applies to maskable icons and
    the squircle mask iOS applies.

    The plate is ivory-300 with the mark in clay — deliberately NOT inverted.
    A dark plate loses the warmth the whole system is built on, and app icons
    sit on wallpapers we do not control.
  -->
  <defs>
    <path id="cd-app-ray-long"
          d="M24 3.5c.86 0 1.28.56 1.38 1.52l1.24 11.88c.21 1.92-1.07 3.2-2.62 3.2s-2.83-1.28-2.62-3.2L22.62 5.02C22.72 4.06 23.14 3.5 24 3.5Z"/>
    <path id="cd-app-ray-short"
          d="M24 10.5c.7 0 1.05.44 1.13 1.2l.89 5.6c.18 1.6-.78 2.8-2.02 2.8s-2.2-1.2-2.02-2.8l.89-5.6c.08-.76.43-1.2 1.13-1.2Z"/>
    <linearGradient id="cd-app-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF9F5"/>
      <stop offset="1" stop-color="#EAE7DC"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#cd-app-plate)"/>

  <g fill="#D97757" transform="translate(96 96) scale(6.6667)">
    <use href="#cd-app-ray-long"/>
    <use href="#cd-app-ray-long" transform="rotate(90 24 24)"/>
    <use href="#cd-app-ray-long" transform="rotate(180 24 24)"/>
    <use href="#cd-app-ray-long" transform="rotate(270 24 24)"/>
    <use href="#cd-app-ray-short" transform="rotate(45 24 24)"/>
    <use href="#cd-app-ray-short" transform="rotate(135 24 24)"/>
    <use href="#cd-app-ray-short" transform="rotate(225 24 24)"/>
    <use href="#cd-app-ray-short" transform="rotate(315 24 24)"/>
  </g>
</svg>
