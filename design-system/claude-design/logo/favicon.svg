<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="img" aria-label="Claude Design">
  <!--
    Favicon / small-size mark. The four short diagonal rays are dropped and
    the long ones thickened — at 16px the eight-ray version fills in and
    reads as a blob. This is the only sanctioned redraw of the mark.

    Theme-aware: the tab strip is dark in dark mode, so the mark flips to a
    lighter clay to stay visible. Static PNG fallbacks cannot do this, which
    is why the SVG favicon should come first in <head>.
  -->
  <style>
    .cd-fav { fill: #D97757; }
    @media (prefers-color-scheme: dark) {
      .cd-fav { fill: #E5A38C; }
    }
  </style>
  <defs>
    <path id="cd-fav-ray"
          d="M24 2.5c1.1 0 1.63.72 1.76 1.95l1.6 13.3c.27 2.46-1.37 4.1-3.36 4.1s-3.63-1.64-3.36-4.1l1.6-13.3C22.37 3.22 22.9 2.5 24 2.5Z"/>
  </defs>
  <g class="cd-fav">
    <use href="#cd-fav-ray"/>
    <use href="#cd-fav-ray" transform="rotate(90 24 24)"/>
    <use href="#cd-fav-ray" transform="rotate(180 24 24)"/>
    <use href="#cd-fav-ray" transform="rotate(270 24 24)"/>
  </g>
</svg>
