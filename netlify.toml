#==============================================================================
# Stratos — Netlify configuration
#
# One site serves two things:
#   /            the static, generated, trilingual public site
#   /portal/*    the React SPA (admin now, client accounts later)
#   /api/*       serverless functions
#==============================================================================

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # 22, not 20, and this is load-bearing rather than housekeeping.
  #
  # `@supabase/supabase-js` builds a realtime client inside `createClient()`
  # even when nothing subscribes to anything, and that client requires a global
  # `WebSocket`. Node did not have one until 22. On 20 the call threw
  #
  #     Node.js detected but native WebSocket not found.
  #
  # out of the function, so POST /api/lead answered 503 for every submission
  # while the credentials were present and correct the whole time.
  #
  # Netlify also warns on every invocation that "Node.js 20 and below are
  # deprecated", so this was due regardless.
  NODE_VERSION = "22"

#------------------------------------------------------------------ redirects
# The portal is a single-page app: a direct hit on /portal/leads must return the
# SPA shell and let the router resolve the path, rather than 404. Everything
# under /portal that is not a real file falls through to index.html.
[[redirects]]
  from = "/portal/*"
  to = "/portal/index.html"
  status = 200

# Convenience: bare /portal and the old /login and /dashboard guesses land in
# the right place instead of on the static 404.
[[redirects]]
  from = "/portal"
  to = "/portal/index.html"
  status = 200

# The homepage has exactly one address per language, and it is not the file
# name. The three shells' own canonical says `/`, `/en/` and `/de/`; before
# Phase 9 the sitemap and 66 pages' worth of internal links said
# `/index.html`, and both URLs answered 200. They are the same document, so
# whichever a crawler reaches first is the one it may keep.
#
# 301 rather than 302: this is permanent, and a temporary redirect asks every
# crawler to keep checking the old one forever. Query strings are preserved by
# Netlify by default, so a campaign link to /index.html?utm_source=… still
# lands with its parameters intact — which matters, because attribution is read
# from them on arrival.
#
# `force = true`, AND THAT IS THE WHOLE RULE
# ------------------------------------------
# These three rules shipped without it and did nothing at all for a year. A
# Netlify redirect whose `from` matches a path that EXISTS in the publish
# directory is shadowed by the file unless the rule forces it, and
# dist/index.html is the most existing file on the site. Measured against
# production before the fix:
#
#   https://stratosweb.hu/index.html       200   (rule present, never fired)
#   https://stratosweb.hu/en/index.html    200   (rule present, never fired)
#   https://stratosweb.hu/de/index.html    200   (rule present, never fired)
#   https://stratosweb.hu/en/seo           301   (no file at that path — fired)
#
# The last line is the control that makes this a diagnosis rather than a guess:
# redirects in this file DO work, and the three that do not are exactly the
# three pointing at real files. Every audit this repo runs reads the config or
# the built HTML, and both said the rule was there.
#
# The duplicate was never visible in Search Console because the canonical in all
# three shells already names `/`, `/en/` and `/de/`, so Google resolved it on our
# behalf and filed the twins under "Alternate page with proper canonical tag".
# That is Google covering for a redirect that was not happening.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en/index.html"
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/de/index.html"
  to = "/de/"
  status = 301
  force = true

# LEGACY WIX URLS
# ---------------
# The inventory these come from is `_build/reports/phase9-wix-url-export.csv`,
# captured from the live Wix sitemap set on 2026-08-09 while stratosweb.hu was
# still served by Wix. Twenty URLs, every status observed rather than assumed.
#
# Only EIGHT of the twenty get a rule, and the reason the other twelve do not is
# the important part of this block.
#
# Twelve of them — /kkv, /rolunk, /branding, /blog, /impresszum and so on — are
# extensionless paths that this build ALREADY answers 200 for, because Netlify
# serves /kkv from kkv.html. Adding `/kkv -> /kkv.html` would invert the
# canonical and is not on the table; the open question was ever only the other
# direction, `/kkv.html -> /kkv`.
#
# WHAT THIS PARAGRAPH USED TO SAY, AND WHY IT WAS WRONG
# It said that rule would deadlock against Netlify's "Pretty URLs", which 301s
# /kkv.html to /kkv — two rules pointing at each other, an infinite loop, so the
# duplicate had to stay. That reasoning assumed Pretty URLs was ON. It is not.
# Measured against production, every route answers 200 in BOTH forms:
#
#   https://stratosweb.hu/kkv                200
#   https://stratosweb.hu/kkv.html           200   (Pretty URLs would 301 this)
#
# So there is no second rule to collide with, and there never was a loop. The
# real reason to leave this alone is smaller and it is not a risk: `absolute()`
# in _build/build.py emits the EXTENSIONLESS form as the canonical, the hreflang
# set, og:url and the sitemap entry, and the .html twin carries that same
# canonical. Google reads it and files the twin under "Alternate page with
# proper canonical tag" — 47 of them, which is the duplicate being resolved
# correctly rather than a defect to chase. 87 forced rules would buy a tidier
# access log and nothing a crawler acts on differently.
#
# If that ever stops being true, the fix is one dashboard setting — Site
# configuration -> Build & deploy -> Post processing -> Pretty URLs — and not a
# rule in this file. Turning it on is safe TODAY for the same reason the loop
# was imaginary: nothing here redirects in the opposing direction.
#
# The eight below are the URLs whose paths genuinely do not exist here.

# The city page that existed for about fifteen minutes.
#
# /weboldal-keszites-gyor.html and its two translations shipped in one deploy
# and were withdrawn in the next: a route dedicated to one city states that the
# company is a Győr company, which is the opposite of what the rest of the site
# says — three languages, Austrian and German clients, Budapest. It narrowed the
# positioning to buy one local query, and that is a bad trade.
#
# They are 301s and not simply gone because the sitemap listed them while they
# were up, so a crawler may hold the URLs. A splat catches both the `.html` form
# the sitemap named and the extensionless form Netlify's Pretty URLs rewrote the
# internal links to. The services index is where the content went — nothing was
# unique to the city page except the framing that was the problem.
[[redirects]]
  from = "/weboldal-keszites-gyor*"
  to = "/szolgaltatasok.html"
  status = 301

[[redirects]]
  from = "/en/web-design-gyor*"
  to = "/en/bespoke-web-design"
  status = 301

[[redirects]]
  from = "/de/webdesign-gyor*"
  to = "/de/website-erstellen-lassen"
  status = 301

# ------------------------------------------------------- RENAMED EN/DE ROUTES
# The SEO ownership pass renamed five English and three German service routes so
# the URL states the commercial intent the page now owns. Every one of these is
# a route that WAS live, indexable and in the sitemap, so every one gets a
# permanent redirect rather than being allowed to 404.
#
# The targets are EXTENSIONLESS on purpose, and that is the whole subtlety here.
# Netlify's "Pretty URLs" 301s `/en/bespoke-web-design.html` to
# `/en/bespoke-web-design`. A rule pointing at the `.html` form would therefore
# resolve as old -> .html -> extensionless: two hops, and the second one is
# invisible in this file. Pointing straight at the extensionless form — which is
# also exactly what `absolute()` in _build/build.py emits as the canonical, the
# hreflang and the sitemap entry — makes each of these a single hop that lands
# on a 200 whether or not that dashboard setting is on.
#
# A splat is used for the same reason it is used on the Győr rules above: it
# catches both the `.html` form the old sitemap named and the extensionless form
# the old internal links used.

# English.
[[redirects]]
  from = "/en/services*"
  to = "/en/bespoke-web-design"
  status = 301

[[redirects]]
  from = "/en/web-design-enterprise*"
  to = "/en/bespoke-web-development"
  status = 301

# NOT a splat, unlike its neighbours. `/en/seo*` would match `/en/seo-consultancy`
# — its own target — and the only thing standing between that rule and a redirect
# loop would be Netlify's static-file-wins precedence. The two forms the old route
# could be held as are named explicitly instead, so the rule cannot match the new
# URL at all. The other renames above keep their splat because no new slug shares
# a prefix with the old one it replaces.
[[redirects]]
  from = "/en/seo"
  to = "/en/seo-consultancy"
  status = 301

[[redirects]]
  from = "/en/seo.html"
  to = "/en/seo-consultancy"
  status = 301

[[redirects]]
  from = "/en/online-store*"
  to = "/en/ecommerce-web-design"
  status = 301

[[redirects]]
  from = "/en/web-design-sme*"
  to = "/en/web-design-small-business"
  status = 301

# German.
[[redirects]]
  from = "/de/leistungen*"
  to = "/de/website-erstellen-lassen"
  status = 301

[[redirects]]
  from = "/de/webdesign-grossunternehmen*"
  to = "/de/webentwicklung-agentur"
  status = 301

[[redirects]]
  from = "/de/suchmaschinenoptimierung*"
  to = "/de/seo-betreuung"
  status = 301

# The six Wix blog posts. Wix used /post/<slug>; this site uses /blog-<slug>.html
# and the slugs differ, so these are the only 301s in the set that carry real
# accumulated link equity.
[[redirects]]
  from = "/post/mennyibe-kerul-egy-weboldal-2026"
  to = "/blog-weboldal-arak.html"
  status = 301

[[redirects]]
  from = "/post/google-vagy-facebook-hirdetes-2026"
  to = "/blog-google-vagy-facebook.html"
  status = 301

[[redirects]]
  from = "/post/google-cegprofil-beallitasa-lepesrol-lepesre"
  to = "/blog-google-cegprofil.html"
  status = 301

[[redirects]]
  from = "/post/mennyi-ugyfelet-veszitesz-elavult-weboldal"
  to = "/blog-elavult-weboldal.html"
  status = 301

[[redirects]]
  from = "/post/hogyan-kerulj-a-google-elso-oldalara"
  to = "/blog-google-elso-oldal.html"
  status = 301

[[redirects]]
  from = "/post/miert-nem-hoz-ugyfeleket-a-weboldalad"
  to = "/blog-miert-nem-hoz-ugyfelet.html"
  status = 301

# There is deliberately NO `/post/*` catch-all. All six posts are listed above
# because the Wix sitemap listed exactly six; a wildcard would answer 200-after-
# redirect for /post/anything-at-all and hide a real 404 behind the blog index.

# Wix Bookings. This site has no scheduling system and Phase 9 forbids implying
# one, so these do not go anywhere that says "booked" — they go to the contact
# page, which is where getting in touch now happens.
#
# REQUIRES USER DECISION: contact, or a 404. Contact is the recommendation — a
# bookmark that lands on the page you can actually reach us from beats a dead
# end, and nothing on that page claims an appointment was made. If a 404 is
# preferred instead, delete these three rules and nothing else changes.
[[redirects]]
  from = "/book-online"
  to = "/ugyfelszolgalat.html"
  status = 301

# The Wix service slug contains a non-ASCII character. Netlify matches the
# decoded path, so the literal form is the one that should fire; the encoded
# form is declared as well because which of the two arrives depends on the
# client, and a rule that never fires costs nothing. Both are on the post-
# cutover verification list precisely because this is the one that could
# silently miss.
[[redirects]]
  from = "/service-page/ingyenes-konzultáció"
  to = "/ugyfelszolgalat.html"
  status = 301

[[redirects]]
  from = "/service-page/ingyenes-konzult%C3%A1ci%C3%B3"
  to = "/ugyfelszolgalat.html"
  status = 301

[[redirects]]
  from = "/login"
  to = "/portal/login"
  status = 302

[[redirects]]
  from = "/dashboard/*"
  to = "/portal/"
  status = 302

#-------------------------------------------------------------------- headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # CSP notes — every allowance below is here for a named reason:
    #   'unsafe-inline' on style-src   the site sets per-frame custom properties
    #                                  on element style attributes. (The other
    #                                  reason used to be Google Fonts' injected
    #                                  inline <style>; that origin is gone.)
    #   no font CDN at all             Archivo and JetBrains Mono are self-hosted
    #                                  under /assets/fonts, so font-src and
    #                                  style-src are both plain 'self'. See
    #                                  assets/css/type.css and scripts/sync-fonts.mjs.
    #   *.supabase.co on connect-src   the portal's REST, auth and realtime.
    #   'self' on script-src only      no inline scripts, no CDN, no eval; the
    #                                  WebGL shaders are strings, not scripts.
    #   frame-ancestors 'none'         belt and braces with X-Frame-Options.
    #   worker-src 'self' blob:        three's DRACOLoader builds its decoder
    #                                  Worker from a blob: URL. See the block
    #                                  below — this is measured, not assumed.
    #
    # ON worker-src, AND WHY THERE IS NO 'wasm-unsafe-eval' HERE
    # ----------------------------------------------------------
    # The two mountain GLBs require KHR_draco_mesh_compression, so they do not
    # parse without a decoder. `experiments/probe-draco-csp.mjs` serves the real
    # files under the real header and measures what Chromium actually does;
    # `_build/reports/draco-csp-probe.txt` is its output. What it found:
    #
    #   * The blocker is `worker-src`, not WebAssembly. DRACOLoader creates its
    #     worker from a blob: URL; with no worker-src set the policy falls back
    #     to `script-src 'self'`, which refuses blob:. Chromium's own words:
    #     "Creating a worker from 'blob:…' violates the following Content
    #     Security Policy directive: \"script-src 'self'\". Note that
    #     'worker-src' was not explicitly set, so 'script-src' is used as a
    #     fallback. The action has been blocked."
    #
    #   * The failure is a HANG, not an error. `GLTFLoader.loadAsync` never
    #     settles, because the worker that would have answered was never
    #     started. Nothing rejects and nothing logs beyond the violation.
    #
    #   * Adding 'wasm-unsafe-eval' on its own fixes nothing — same hang, same
    #     violation, because the worker still never starts.
    #
    #   * With worker-src fixed and NOTHING else added, the self-hosted
    #     JavaScript decoder decodes both files: 106 ms for the 131,884-triangle
    #     desktop asset and 76 ms for the 48,336-triangle mobile one, once, in a
    #     worker, off the main thread.
    #
    #   * 'wasm-unsafe-eval' would additionally allow the WASM decoder, which is
    #     about four times faster at 24 ms / 19 ms. It is therefore *faster*,
    #     and it is not *required*: the brief's rule is that it may only be used
    #     if demonstrably required, and a working decoder at a one-off 106 ms in
    #     a worker means it is not. So the narrower policy ships and
    #     `MOUNTAIN_DECODER` in mountainAsset.ts is pinned to 'js' to match it.
    #     Widening the policy and flipping that constant is a two-line change if
    #     the decode cost ever turns out to matter on a real device.
    #
    # blob: on worker-src is a small allowance in this policy specifically:
    # script-src stays 'self' with no unsafe-inline and no eval, so there is no
    # route by which injected script could author the blob in the first place.
    # GOOGLE ANALYTICS 4 — the one deliberate widening of this policy
    # -------------------------------------------------------------
    # Added in Phase 9 because GA4 was approved as the measurement provider. It
    # is recorded here rather than absorbed silently, because until this change
    # `script-src` was `'self'` with no exceptions at all, and that was worth
    # something.
    #
    # What was added, and nothing beyond it:
    #
    #   script-src   www.googletagmanager.com   gtag.js itself.
    #   connect-src  *.google-analytics.com     where events are sent. The
    #                *.analytics.google.com     wildcards cover the regional
    #                www.googletagmanager.com   endpoints GA4 picks at runtime.
    #   img-src      www.google-analytics.com   the pixel fallback used when
    #                www.googletagmanager.com   sendBeacon/fetch are unavailable.
    #
    # What was deliberately NOT added:
    #
    #   * `stats.g.doubleclick.net` and the other advertising hosts. Google
    #     Signals and ads personalisation are off; adding those hosts is what
    #     turns analytics into ad tracking, and nothing here asks for that.
    #   * `'unsafe-inline'` on script-src. gtag is loaded as an external script
    #     and configured from assets/js/analytics.js, so no inline block is
    #     needed and the strongest part of this policy is untouched.
    #
    # Nothing above loads before the visitor consents — the tag is not injected
    # at all until then (Basic Consent Mode). A CSP entry is permission, not an
    # instruction: these hosts being allowed does not mean anything contacts
    # them. See assets/js/analytics.js.
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' https://www.googletagmanager.com;
      worker-src 'self' blob:;
      style-src 'self' 'unsafe-inline';
      font-src 'self';
      img-src 'self' data: blob: https://*.supabase.co https://www.google-analytics.com https://www.googletagmanager.com;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com;
      form-action 'self';
      frame-ancestors 'none';
      base-uri 'self';
      object-src 'none';
      upgrade-insecure-requests
    """

# The portal is private. Nothing about it should be cached by a shared cache or
# indexed, and a stale shell after a deploy would strand people on old JS.
[[headers]]
  for = "/portal/*"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Hashed build output is immutable by definition.
[[headers]]
  for = "/portal/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The PDF viewer's worker is an ES module (.mjs). A module worker is refused
# unless it is served as JavaScript, so say so rather than trust a default.
[[headers]]
  for = "/portal/assets/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# The portal's web app manifest (Add to Home Screen, push on iPhone). Without
# this it is served as octet-stream, which nosniff makes browsers refuse.
[[headers]]
  for = "/portal/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
