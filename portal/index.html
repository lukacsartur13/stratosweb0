<!doctype html>
<html lang="hu" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The portal must never appear in search results. This is a courtesy to
         crawlers that respect it, not a security control — the real gate is
         Supabase auth plus the RLS policies. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="same-origin" />
    <link rel="icon" href="/assets/img/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Stratos — Portal</title>
  </head>
  <body class="bg-ink text-paper font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
